; =============================================================================
; CouchDB settings for Obsidian Self-hosted LiveSync
; =============================================================================
; Same values LiveSync's provisioning script applies (utils/couchdb/provision.ts
; in vrtmrz/obsidian-livesync), kept as a file so the server needs no Deno.
; Copied into etc/default.d/90-livesync.ini at container start (see the
; entrypoint in docker-compose.yml), so runtime _config writes land in
; local.d/docker.ini (a volume) and this file stays the source of truth.
; =============================================================================

[couchdb]
single_node = true
max_document_size = 50000000

[chttpd]
require_valid_user = true
; /_up stays open for the container healthcheck and scripts/verify.sh. It only
; ever answers a health status ({"seeds":{},"status":"ok"}), never data.
require_valid_user_except_for_up = true
max_http_request_size = 4294967296
enable_cors = true

[chttpd_auth]
require_valid_user = true

[httpd]
WWW-Authenticate = Basic realm="couchdb"
enable_cors = true

[cors]
; Obsidian desktop, Obsidian mobile (Capacitor), and localhost.
origins = app://obsidian.md,capacitor://localhost,http://localhost
credentials = true
headers = accept, authorization, content-type, origin, referer
methods = GET, PUT, POST, HEAD, DELETE
max_age = 3600
